services:
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - app_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=sqlite:////app/data/facturacion.db
      - PDF_DIR=/app/data/pdfs
      - PRODUCTION_ARCA=true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app_data:
