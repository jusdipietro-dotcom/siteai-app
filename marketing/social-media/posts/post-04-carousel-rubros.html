<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un sitio para cada rubro - Automatic IA Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 50px 40px;
        }

        .header {
            text-align: center;
        }

        .title {
            font-size: 56px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .title .highlight {
            color: #06b6d4;
        }

        .subtitle {
            font-size: 24px;
            color: #94a3b8;
            font-weight: 500;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 100%;
            margin: 30px 0;
            flex: 1;
            max-width: 950px;
        }

        .card {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(6, 182, 212, 0.05));
            border: 2px solid rgba(6, 182, 212, 0.2);
            border-radius: 12px;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            border-color: rgba(6, 182, 212, 0.5);
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(6, 182, 212, 0.08));
            transform: translateY(-5px);
        }

        .emoji {
            font-size: 56px;
            margin-bottom: 15px;
            display: block;
        }

        .rubro-name {
            font-size: 20px;
            font-weight: 700;
            color: #06b6d4;
            letter-spacing: 0.5px;
        }

        .footer {
            text-align: center;
            width: 100%;
            padding-top: 20px;
            border-top: 2px solid rgba(6, 182, 212, 0.3);
        }

        .cta-text {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .cta-button {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.3s ease;
        }

        .cta-button:hover {
            transform: scale(1.05);
        }

        .brand {
            font-size: 16px;
            color: #94a3b8;
            margin-top: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Un sitio web para cada <span class="highlight">rubro</span></div>
            <div class="subtitle">Plantillas diseñadas para tu industria</div>
        </div>

        <div class="grid">
            <div class="card">
                <span class="emoji">🍽️</span>
                <div class="rubro-name">Restaurantes</div>
            </div>

            <div class="card">
                <span class="emoji">⚖️</span>
                <div class="rubro-name">Abogados</div>
            </div>

            <div class="card">
                <span class="emoji">⚕️</span>
                <div class="rubro-name">Médicos</div>
            </div>

            <div class="card">
                <span class="emoji">💪</span>
                <div class="rubro-name">Gimnasios</div>
            </div>

            <div class="card">
                <span class="emoji">💇</span>
                <div class="rubro-name">Peluquerías</div>
            </div>

            <div class="card">
                <span class="emoji">🏠</span>
                <div class="rubro-name">Inmobiliarias</div>
            </div>
        </div>

        <div class="footer">
            <div class="cta-text">¿Cuál es el tuyo?</div>
            <button class="cta-button">Creá tu sitio gratis</button>
            <div class="brand">Automatic IA Lab</div>
        </div>
    </div>
</body>
</html>
