<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60 Segundos - Automatic IA Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            text-align: center;
            position: relative;
        }

        .clock-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 3px solid rgba(6, 182, 212, 0.2);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .clock-circle-inner {
            position: absolute;
            width: 240px;
            height: 240px;
            border: 2px solid rgba(6, 182, 212, 0.1);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .big-number {
            font-family: 'Poppins', sans-serif;
            font-size: 280px;
            font-weight: 900;
            color: #06b6d4;
            line-height: 1;
            margin-bottom: 0px;
            text-shadow: 0 10px 40px rgba(6, 182, 212, 0.3);
            position: relative;
            z-index: 1;
        }

        .seconds-label {
            font-size: 48px;
            font-weight: 700;
            color: #06b6d4;
            margin-top: -20px;
            margin-bottom: 50px;
            position: relative;
            z-index: 1;
        }

        .main-text {
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 40px;
            line-height: 1.3;
            max-width: 900px;
            position: relative;
            z-index: 1;
        }

        .subtext {
            font-size: 28px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 60px;
            max-width: 850px;
            position: relative;
            z-index: 1;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #06b6d4, transparent);
            margin: 40px auto;
            position: relative;
            z-index: 1;
        }

        .brand-footer {
            margin-top: 40px;
            padding: 20px;
            border-top: 2px solid rgba(6, 182, 212, 0.3);
            position: relative;
            z-index: 1;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: #06b6d4;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="clock-circle"></div>
        <div class="clock-circle-inner"></div>

        <div class="big-number">60</div>
        <div class="seconds-label">segundos</div>

        <div class="main-text">
            Es todo lo que necesitás para tener tu sitio web
        </div>

        <div class="subtext">
            Sin programar. Sin diseñar. Sin complicaciones.
        </div>

        <div class="divider"></div>

        <div class="brand-footer">
            <div class="brand-name">Automatic IA Lab</div>
        </div>
    </div>
</body>
</html>
