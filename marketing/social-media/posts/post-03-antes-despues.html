<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antes y Después - Automatic IA Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 30px;
        }

        .title {
            font-size: 44px;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .comparison {
            display: flex;
            gap: 20px;
            width: 100%;
            height: 100%;
            max-height: 700px;
            margin-bottom: 30px;
        }

        .side {
            flex: 1;
            border-radius: 12px;
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 700;
        }

        .antes {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.15), rgba(220, 38, 38, 0.05));
            border: 2px solid rgba(220, 38, 38, 0.3);
        }

        .despues {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.15), rgba(6, 182, 212, 0.05));
            border: 2px solid rgba(6, 182, 212, 0.3);
        }

        .label {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .antes .label {
            color: #ef4444;
            text-transform: uppercase;
        }

        .despues .label {
            color: #06b6d4;
            text-transform: uppercase;
        }

        .content {
            font-size: 22px;
            line-height: 1.6;
            font-weight: 600;
        }

        .antes .content {
            color: #fca5a5;
        }

        .despues .content {
            color: #06d6d8;
        }

        .footer {
            width: 100%;
            text-align: center;
            padding-top: 20px;
            border-top: 2px solid rgba(6, 182, 212, 0.3);
        }

        .brand-text {
            font-size: 20px;
            font-weight: 700;
            color: #06b6d4;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .cta {
            font-size: 16px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .antes .icon {
            color: #ef4444;
        }

        .despues .icon {
            color: #06b6d4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">ANTES vs DESPUÉS</div>

        <div class="comparison">
            <div class="side antes">
                <div class="icon">❌</div>
                <div class="label">ANTES</div>
                <div class="content">
                    Sin sitio web<br/>
                    Perdés clientes<br/>
                    Dependés de redes<br/>
                    No te encuentran<br/>
                    en Google
                </div>
            </div>

            <div class="side despues">
                <div class="icon">✅</div>
                <div class="label">DESPUÉS</div>
                <div class="content">
                    Con Automatic IA Lab<br/>
                    Presencia 24/7<br/>
                    Clientes te encuentran<br/>
                    Profesionalismo<br/>
                    Independencia
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="brand-text">Automatic IA Lab</div>
            <div class="cta">Transformá tu negocio hoy</div>
        </div>
    </div>
</body>
</html>
