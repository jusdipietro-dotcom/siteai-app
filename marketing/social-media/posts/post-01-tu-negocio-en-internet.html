<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu negocio en internet - Automatic IA Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            text-align: center;
            position: relative;
        }

        .accent-line {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 6px;
            background: linear-gradient(90deg, transparent, #06b6d4, transparent);
            border-radius: 3px;
        }

        .main-text {
            font-size: 72px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 40px;
            line-height: 1.2;
            max-width: 900px;
        }

        .main-text .highlight {
            background: linear-gradient(120deg, #06b6d4, #0891b2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 48px;
            font-weight: 600;
            color: #06b6d4;
            margin-bottom: 60px;
            max-width: 900px;
        }

        .brand-section {
            margin-top: 80px;
            padding: 30px 0;
            border-top: 2px solid rgba(6, 182, 212, 0.3);
        }

        .brand-text {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .website {
            font-size: 28px;
            font-weight: 700;
            color: #06b6d4;
            text-decoration: none;
        }

        .cta-button {
            margin-top: 40px;
            padding: 16px 40px;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.3s ease;
        }

        .cta-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="accent-line"></div>

        <div class="main-text">
            Tu negocio merece estar en <span class="highlight">internet</span>
        </div>

        <div class="subtitle">
            Creá tu sitio web gratis con IA
        </div>

        <button class="cta-button">Empezá ahora</button>

        <div class="brand-section">
            <div class="brand-text">Automatic IA Lab</div>
            <div class="website">automaticialab.com</div>
        </div>
    </div>
</body>
</html>
