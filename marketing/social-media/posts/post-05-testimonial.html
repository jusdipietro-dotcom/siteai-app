<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial - Automatic IA Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #0f172a 0%, #1a1f3a 50%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 60px;
            text-align: center;
            position: relative;
        }

        .quote-mark-top {
            font-family: 'Playfair Display', serif;
            font-size: 140px;
            color: rgba(6, 182, 212, 0.2);
            line-height: 0.8;
            margin-bottom: 20px;
        }

        .quote-text {
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.6;
            margin-bottom: 50px;
            max-width: 900px;
            font-style: italic;
            letter-spacing: -0.5px;
        }

        .quote-text .highlight {
            color: #06b6d4;
        }

        .stars {
            font-size: 36px;
            color: #fbbf24;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }

        .author-section {
            margin-bottom: 50px;
        }

        .author-name {
            font-size: 26px;
            font-weight: 800;
            color: #06b6d4;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .author-title {
            font-size: 18px;
            color: #94a3b8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider {
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #06b6d4, transparent);
            margin: 40px auto;
        }

        .footer {
            padding-top: 30px;
            border-top: 2px solid rgba(6, 182, 212, 0.3);
        }

        .cta-text {
            font-size: 22px;
            color: #cbd5e1;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .website {
            font-size: 32px;
            font-weight: 800;
            color: #06b6d4;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .testimonial-badge {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 20px;
            font-size: 14px;
            color: #06b6d4;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .quote-text {
                font-size: 32px;
            }

            .quote-mark-top {
                font-size: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quote-mark-top">"</div>

        <div class="quote-text">
            En 3 minutos completé el formulario y en <span class="highlight">1 minuto ya tenía mi sitio publicado</span>. Mis pacientes lo ven muy <span class="highlight">profesional</span>.
        </div>

        <div class="stars">★★★★★</div>

        <div class="author-section">
            <div class="author-name">— Martina González</div>
            <div class="author-title">Nutricionista</div>
            <div class="testimonial-badge">Cliente verificado</div>
        </div>

        <div class="divider"></div>

        <div class="footer">
            <div class="cta-text">Tu turno. Creá tu sitio gratis hoy</div>
            <div class="website">automaticialab.com</div>
        </div>
    </div>
</body>
</html>
